services:
  # =============================================================
  # ChainedRisk Backend API
  # FastAPI backend deployed as a Python web service on Render.
  # Frontend is deployed separately on Vercel.
  # =============================================================
  - type: web
    name: chainedrisk-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: chainedrisk-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: CR_ENV
        value: production
      - key: CR_SECRET_KEY
        generateValue: true
      - key: CR_APPROVAL_HMAC_KEY
        generateValue: true
      - key: CR_DB_URL
        value: sqlite:////app/data/chainedrisk.db
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
